<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A research atlas of ageing and care. Explore human needs, existing responses and questions worth investigating.">
  <meta name="theme-color" content="#fcfdff">
  <link rel="icon" href="data:,">
  <title>Who Cares</title>
  <link rel="stylesheet" href="css/atlas.css?v=compact-header-46">
  <link rel="stylesheet" href="css/atlas-map.css?v=spatial-records-48">
  <link rel="stylesheet" href="css/atlas-study.css">
</head>
<body>
  <a class="skip" href="#map">Skip to map</a>
  <header class="masthead">
    <button class="brand" id="home" aria-label="Who Cares, return to atlas overview">Who Cares</button>
    <p class="brand-tagline">Ageing and care, mapped for venture builders.</p>
    <nav class="header-actions" aria-label="Atlas tools"><button id="study-search">Search</button><button id="study-help">How to explore</button></nav>
  </header>
  <main id="workspace" hidden>
    <div class="map-column">
      <section class="study-intro" aria-label="Current map introduction"><div><p class="kicker" id="study-kicker"></p><h1 id="study-title"></h1><p id="study-description"></p></div><div class="study-actions"><button id="map-evidence" hidden>Scope & evidence ↗</button></div></section>
    <nav id="map-breadcrumbs" aria-label="Map location" hidden><button id="icps-home" aria-label="All needs">All needs</button><button id="persona-change" class="persona-change" aria-label="Return to this perspective overview"></button><div id="map-breadcrumb-trail"></div></nav>
      <div class="study-stage"><section id="map" tabindex="0" aria-label="Interactive care atlas" aria-describedby="map-help">
        <div id="pan-surface"><div id="labels"></div></div><span id="level-range" aria-live="polite"></span>
        <div id="loading" role="status">Loading the research atlas…</div>
        <div id="map-empty" hidden><span id="map-empty-message">No items in view.</span><button id="recover">Return to overview</button></div>
      </section>
      </div>
      <div class="map-bottom">
        <div class="map-controls" aria-label="Map controls"><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="Zoom in">+</button><button id="overview" aria-label="Show all" title="Show all"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></button></div>
      </div>
    </div>
    <aside id="inspector" hidden aria-label="Research reading panel">
      <div class="panel-nav"><button id="panel-back" aria-label="Back within research">← Back</button><button id="panel-close" aria-label="Close research panel">✕</button></div>
      <div id="panel-content" tabindex="-1"></div>
    </aside>
  </main>
  <p class="sr-only" id="map-help">Drag or scroll to pan. Pinch or Ctrl/Command-scroll to zoom. Click a group to enter; use breadcrumbs to return. Arrow keys pan, plus and minus zoom.</p>
  <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
  <script src="js/config.js"></script>
  <script type="module" src="js/atlas.js?v=spatial-records-48"></script>
</body>
</html>
