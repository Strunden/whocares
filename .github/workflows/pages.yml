name: Deploy Who Cares to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build atlas discovery index
        run: node scripts/build-atlas-data.mjs

      - name: Check static site
        run: |
          python3 -c "import json; d=json.load(open('site/data/index.json')); assert d['entries'], 'index empty'; print(d['counts'])"
          test -f site/index.html
          test -f site/js/app.js
          test -f site/js/config.js
          test -f site/companies/entry.html
          test -f site/companies.html
          test -f site/mechanism.html
          test -f site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
